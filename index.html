<script>

const user="hdiasc";
const apiKey="c4206856e9aebd869468e0c52b182c14";

/* pegar álbum mais ouvido */

fetch(
`https://ws.audioscrobbler.com/2.0/?method=user.gettopalbums&user=${user}&period=7day&limit=1&api_key=${apiKey}&format=json`
)

.then(res=>res.json())

.then(data=>{

if(
!data.topalbums ||
!data.topalbums.album ||
data.topalbums.album.length===0
){

document.getElementById("track")
.textContent="Nenhum álbum encontrado";

return;

}

const album=data.topalbums.album[0];

const name=album.name;
const artist=album.artist.name;

/* pegar imagem */

let image="";

if(album.image){

for(let i=album.image.length-1;i>=0;i--){

if(album.image[i]["#text"]){

image=album.image[i]["#text"];
break;

}

}

}

/* fallback */

if(!image){

image="https://via.placeholder.com/300";

}

document.getElementById("cover").src=image;

/* texto */

document.getElementById("track")
.textContent=name;

document.getElementById("artist")
.textContent=artist;

/* botão spotify */

const spotifyURL=
`https://open.spotify.com/search/${encodeURIComponent(name+" "+artist)}`;

document.getElementById("spotifyBtn")
.href=spotifyURL;

})

.catch(error=>{

document.getElementById("track")
.textContent="Erro ao carregar";

console.log(error);

});

</script>
