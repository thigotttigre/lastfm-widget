<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body{
margin:0;
font-family:sans-serif;
overflow:hidden;
}

#card{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-radius:16px;
box-sizing:border-box;
height:90px;
overflow:hidden;
}

#cover{
width:65px;
height:65px;
border-radius:10px;
object-fit:cover;
flex-shrink:0;
background:#ccc;
}

#content{
flex:1;
min-width:0;
}

#label{
font-size:10px;
opacity:0.8;
letter-spacing:1px;
}

#track{
font-size:14px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

#artist{
font-size:12px;
opacity:0.9;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

#spotifyBtn{

margin-top:5px;

display:inline-block;

padding:4px 10px;

border-radius:999px;

font-size:11px;

text-decoration:none;

background:#1DB954;

color:white;

font-weight:bold;

}

</style>

</head>

<body>

<div id="card">

<img id="cover">

<div id="content">

<div id="label">
MAIS OUVIDA DA SEMANA
</div>

<div id="track">
Carregando...
</div>

<div id="artist"></div>

<a id="spotifyBtn" target="_blank">
Ouvir no Spotify
</a>

</div>

</div>

<script>

const user="hdiasc";
const apiKey="c4206856e9aebd869468e0c52b182c14";

/* buscar top track */

fetch(
`https://ws.audioscrobbler.com/2.0/?method=user.gettoptracks&user=${user}&period=7day&limit=1&api_key=${apiKey}&format=json`
)

.then(r=>r.json())

.then(data=>{

const track=data.toptracks.track[0];

const name=track.name;

const artist=track.artist.name;

/* pegar imagem válida */

let image="";

track.image.forEach(img=>{

if(img["#text"])
image=img["#text"];

});

/* fallback seguro */

if(!image){

image="https://via.placeholder.com/300";

}

document.getElementById("cover").src=image;

document.getElementById("track")
.textContent=name;

document.getElementById("artist")
.textContent=artist;

/* botão spotify */

const spotifyURL=
`https://open.spotify.com/search/${encodeURIComponent(name+" "+artist)}`;

document.getElementById("spotifyBtn")
.href=spotifyURL;

/* cor dominante simples */

const img=new Image();

img.crossOrigin="anonymous";

img.src=image;

img.onload=function(){

const canvas=document.createElement("canvas");

const ctx=canvas.getContext("2d");

canvas.width=img.width;

canvas.height=img.height;

ctx.drawImage(img,0,0);

const pixels=ctx.getImageData(
0,0,
canvas.width,
canvas.height
).data;

let r=0,g=0,b=0,count=0;

for(let i=0;i<pixels.length;i+=80){

r+=pixels[i];
g+=pixels[i+1];
b+=pixels[i+2];
count++;

}

r=Math.floor(r/count);
g=Math.floor(g/count);
b=Math.floor(b/count);

const bg=`rgb(${r},${g},${b})`;

document.getElementById("card")
.style.background=bg;

/* contraste */

const brightness=
(r*299+g*587+b*114)/1000;

document.getElementById("card")
.style.color=
brightness>150
?"#000"
:"#fff";

};

})

.catch(()=>{

document.getElementById("track")
.textContent="Erro ao carregar";

});

</script>

</body>

</html>
