<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mais Ouvida da Semana</title>

<style>

body{
margin:0;
font-family:sans-serif;
}

#card{
border-radius:16px;
overflow:hidden;
transition:0.4s;
display:flex;
align-items:center;
gap:12px;
padding:10px;
box-sizing:border-box;
}

#cover{
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
flex-shrink:0;
}

#content{
flex:1;
min-width:0;
}

#label{
font-size:10px;
opacity:0.8;
letter-spacing:1px;
}

#track{
font-size:14px;
font-weight:bold;
margin-top:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

#artist{
font-size:12px;
opacity:0.9;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

#spotifyBtn{

margin-top:6px;

display:inline-block;

padding:4px 10px;

border-radius:999px;

font-size:11px;

text-decoration:none;

background:#1DB954;

color:white;

font-weight:bold;

}

</style>

</head>

<body>

<div id="card">

<img id="cover">

<div id="content">

<div id="label">
MAIS OUVIDA DA SEMANA
</div>

<div id="track">
Carregando...
</div>

<div id="artist"></div>

<a id="spotifyBtn"
target="_blank">
Ouvir no Spotify
</a>

</div>

</div>

<script>

const user="hdiasc";
const apiKey="c4206856e9aebd869468e0c52b182c14";

const url=
`https://ws.audioscrobbler.com/2.0/?method=user.gettoptracks&user=${user}&period=7day&limit=1&api_key=${apiKey}&format=json`;

fetch(url)

.then(r=>r.json())

.then(data=>{

const track=data.toptracks.track[0];

const name=track.name;

const artist=track.artist.name;

/* pegar melhor imagem disponível */

let image="";

for(let i=track.image.length-1;i>=0;i--){

if(track.image[i]["#text"]){

image=track.image[i]["#text"];
break;

}

}

/* fallback imagem */

if(!image){

image="https://lastfm.freetls.fastly.net/i/u/300x300/2a96cbd8b46e442fc41c2b86b821562f.png";

}

document.getElementById("track").textContent=name;

document.getElementById("artist").textContent=artist;

document.getElementById("cover").src=image;

/* link spotify */

const spotifySearch=
`https://open.spotify.com/search/${encodeURIComponent(name+" "+artist)}`;

document.getElementById("spotifyBtn").href=
spotifySearch;

/* detectar cor dominante */

const img=new Image();

img.crossOrigin="Anonymous";

img.src=image;

img.onload=function(){

const canvas=document.createElement("canvas");

const ctx=canvas.getContext("2d");

canvas.width=img.width;

canvas.height=img.height;

ctx.drawImage(img,0,0);

const data=ctx.getImageData(
0,0,
canvas.width,
canvas.height
).data;

let r=0,g=0,b=0,count=0;

for(let i=0;i<data.length;i+=40){

r+=data[i];

g+=data[i+1];

b+=data[i+2];

count++;

}

r=Math.floor(r/count);

g=Math.floor(g/count);

b=Math.floor(b/count);

const color=`rgb(${r},${g},${b})`;

document.getElementById("card")
.style.background=color;

/* contraste automático */

const brightness=
(r*299+g*587+b*114)/1000;

const textColor=
brightness>150
?"#000"
:"#fff";

document.getElementById("card")
.style.color=textColor;

}

})

.catch(()=>{

document.getElementById("track")
.textContent="Erro ao carregar";

});

</script>

</body>

</html>
